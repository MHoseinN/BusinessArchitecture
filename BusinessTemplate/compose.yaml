services:
  postgres:
    image: postgres:16
    container_name: business-template-postgres
    environment:
      POSTGRES_DB: business_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - business_template_pg:/var/lib/postgresql/data

volumes:
  business_template_pg:
